<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1923">
<title>Exchange Tracker — THB/BDT</title>
<link rel="apple-touch-icon" href="data:,">
<style>
  html,body{margin:0;padding:0;background:#0f1923;}
  *{-webkit-tap-highlight-color:transparent;}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
// Storage shim: saves data in this phone's browser (localStorage).
// NOTE: data lives per-device. For shared multi-phone data, connect a backend later.
window.storage = {
  async get(key, shared) {
    const v = localStorage.getItem("ext_" + key);
    if (v === null) throw new Error("not found");
    return { key, value: v, shared: !!shared };
  },
  async set(key, value, shared) {
    localStorage.setItem("ext_" + key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared) {
    localStorage.removeItem("ext_" + key);
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith("ext_") && (!prefix || k.slice(4).startsWith(prefix))) keys.push(k.slice(4));
    }
    return { keys, prefix, shared: !!shared };
  },
};
</script>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TX_KEY = "exchange_transactions";
const SUPPLIER_KEY = "exchange_suppliers";
const RATE_KEY = "exchange_rate";
const ADMIN_PW_KEY = "exchange_admin_pw";
const STAFF_PW_KEY = "exchange_staff_pw";
const FLOAT_KEY = "exchange_staff_float";
const EXPENSE_KEY = "exchange_expenses";
const OWNER_PHONE_KEY = "exchange_owner_phone";

const initialForm = {
  customerName: "",
  customerPhone: "",
  deliveryDate: "",
  assignedTo: "",
  thbAmount: "",
  rate: "",
  bdtAmount: "",
  commission: "",
  netBdt: "",
  paymentMethod: "Cash",
  amountPaid: "",
  notes: "",
};

const initialBuyForm = {
  supplierName: "",
  supplierContact: "",
  advanceFrom: null,
  advanceAmt: 0,
  thbAmount: "",
  rate: "",
  bdtCost: "",
  amountPaid: "",
  paymentMethod: "Cash",
  paymentDate: new Date().toISOString().slice(0, 10),
  notes: "",
};

function formatNum(n, d = 2) {
  if (!n && n !== 0) return "—";
  return Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function nowStr() { return new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" }); }


// ── Calendar date picker: shows DD-MM-YYYY, tap to open calendar, no typing ──
function DateField({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const iso = value || new Date().toISOString().slice(0, 10);
  const [viewY, setViewY] = useState(parseInt(iso.slice(0, 4)));
  const [viewM, setViewM] = useState(parseInt(iso.slice(5, 7)) - 1);

  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW = ["Su","Mo","Tu","We","Th","Fr","Sa"];

  function fmt(isoStr) {
    if (!isoStr) return "";
    const [y, m, d] = isoStr.split("-");
    return `${d}-${m}-${y}`;
  }
  function pad(n) { return String(n).padStart(2, "0"); }

  const first = new Date(viewY, viewM, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(viewY, viewM + 1, 0).getDate();
  const todayIso = new Date().toISOString().slice(0, 10);

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  function prevMonth() { if (viewM === 0) { setViewM(11); setViewY(viewY - 1); } else setViewM(viewM - 1); }
  function nextMonth() { if (viewM === 11) { setViewM(0); setViewY(viewY + 1); } else setViewM(viewM + 1); }

  return (
    <div style={{ position: "relative" }}>
      <button style={{ width: "100%", background: "#0f1923", border: "1px solid #1e3a5f", borderRadius: 8, padding: "11px 12px", color: "#e8edf2", fontSize: 15, textAlign: "left", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}
        onClick={() => { setOpen(o => !o); setViewY(parseInt(iso.slice(0, 4))); setViewM(parseInt(iso.slice(5, 7)) - 1); }}>
        <span>📅 {fmt(iso)}</span>
        <span style={{ color: "#4fc3f7", fontSize: 12 }}>{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div style={{ marginTop: 6, background: "#132030", border: "1px solid #2d6a9f", borderRadius: 12, padding: 12, boxShadow: "0 8px 24px rgba(0,0,0,0.5)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <button style={{ background: "#1a3a5c", border: "none", borderRadius: 8, color: "#4fc3f7", fontSize: 18, padding: "4px 14px", cursor: "pointer" }} onClick={prevMonth}>‹</button>
            <span style={{ fontWeight: 800, fontSize: 14, color: "#e8edf2" }}>{MONTHS[viewM]} {viewY}</span>
            <button style={{ background: "#1a3a5c", border: "none", borderRadius: 8, color: "#4fc3f7", fontSize: 18, padding: "4px 14px", cursor: "pointer" }} onClick={nextMonth}>›</button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2, marginBottom: 4 }}>
            {DOW.map(d => <div key={d} style={{ textAlign: "center", fontSize: 10, color: "#5a8aaa", fontWeight: 700, padding: "4px 0" }}>{d}</div>)}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2 }}>
            {cells.map((d, i) => {
              if (d === null) return <div key={`e${i}`} />;
              const cellIso = `${viewY}-${pad(viewM + 1)}-${pad(d)}`;
              const isSel = cellIso === iso;
              const isToday = cellIso === todayIso;
              return (
                <button key={cellIso}
                  style={{ padding: "8px 0", borderRadius: 8, border: isToday && !isSel ? "1px solid #4fc3f7" : "1px solid transparent", background: isSel ? "#1565c0" : "transparent", color: isSel ? "#fff" : "#e8edf2", fontWeight: isSel || isToday ? 800 : 400, fontSize: 13, cursor: "pointer" }}
                  onClick={() => { onChange(cellIso); setOpen(false); }}>{d}</button>
              );
            })}
          </div>
          <button style={{ marginTop: 8, width: "100%", padding: "8px 0", borderRadius: 8, border: "1px solid #4fc3f755", background: "#0a2a30", color: "#4fc3f7", fontWeight: 700, fontSize: 12, cursor: "pointer" }}
            onClick={() => { onChange(todayIso); setOpen(false); }}>Today ({fmt(todayIso)})</button>
        </div>
      )}
    </div>
  );
}

function App() {
  const [role, setRole] = useState(null); // null | "admin" | "staff"
  const [screen, setScreen] = useState("roleSelect"); // roleSelect | setup | login | app
  const [view, setView] = useState("dashboard");
  const [wide, setWide] = useState(typeof window !== "undefined" && window.innerWidth >= 900);

  const [transactions, setTransactions] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [floatEntries, setFloatEntries] = useState([]);
  const [expenses, setExpenses] = useState([]);
  const [defaultRate, setDefaultRate] = useState("");
  const [adminPw, setAdminPw] = useState(null);
  const [staffPw, setStaffPw] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [refreshing, setRefreshing] = useState(false);

  const [form, setForm] = useState({ ...initialForm });
  const [buyForm, setBuyForm] = useState({ ...initialBuyForm });
  const [saved, setSaved] = useState(false);
  const [filterDate, setFilterDate] = useState(todayStr());
  const [histMode, setHistMode] = useState("day");

  const [pwInput, setPwInput] = useState("");
  const [pwError, setPwError] = useState("");
  const [suAdmin, setSuAdmin] = useState("");
  const [suAdmin2, setSuAdmin2] = useState("");
  const [suStaff, setSuStaff] = useState("");
  const [suStaff2, setSuStaff2] = useState("");
  const [loginAs, setLoginAs] = useState("staff");
  const [staffName, setStaffName] = useState("");
  const [ownerPhone, setOwnerPhone] = useState(null);
  const [suPhone, setSuPhone] = useState("");
  const [forgotMode, setForgotMode] = useState(false);
  const [forgotPhone, setForgotPhone] = useState("");
  const [forgotVerified, setForgotVerified] = useState(false);
  const [resetPw, setResetPw] = useState("");
  const [resetPw2, setResetPw2] = useState("");

  useEffect(() => {
    const onResize = () => setWide(window.innerWidth >= 900);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  useEffect(() => {
    (async () => {
      // Load passwords with retries so a slow connection never wrongly shows first-time setup
      let gotAdmin = null, gotStaff = null, gotPhone = null;
      for (let attempt = 0; attempt < 3 && !gotAdmin; attempt++) {
        try { const p = await window.storage.get(ADMIN_PW_KEY, true); if (p?.value) gotAdmin = p.value; } catch {}
        if (!gotAdmin && attempt < 2) await new Promise(r => setTimeout(r, 800));
      }
      try { const p = await window.storage.get(STAFF_PW_KEY, true); if (p?.value) gotStaff = p.value; } catch {}
      try { const p = await window.storage.get(OWNER_PHONE_KEY, true); if (p?.value) gotPhone = p.value; } catch {}
      if (gotAdmin) setAdminPw(gotAdmin);
      if (gotStaff) setStaffPw(gotStaff);
      if (gotPhone) setOwnerPhone(gotPhone);
      try { const t = await window.storage.get(TX_KEY, true); if (t) setTransactions(JSON.parse(t.value)); } catch {}
      try { const s = await window.storage.get(SUPPLIER_KEY, true); if (s) setSuppliers(JSON.parse(s.value)); } catch {}
      try { const f = await window.storage.get(FLOAT_KEY, true); if (f) setFloatEntries(JSON.parse(f.value)); } catch {}
      try { const e = await window.storage.get(EXPENSE_KEY, true); if (e) setExpenses(JSON.parse(e.value)); } catch {}
      try { const r = await window.storage.get(RATE_KEY, true); if (r) setDefaultRate(r.value); } catch {}
      setLoaded(true);
    })();
  }, []);

  async function reloadData() {
    if (refreshing) return;
    setRefreshing(true);
    try { const t = await window.storage.get(TX_KEY, true); if (t) setTransactions(JSON.parse(t.value)); } catch {}
    try { const s = await window.storage.get(SUPPLIER_KEY, true); if (s) setSuppliers(JSON.parse(s.value)); } catch {}
    try { const f = await window.storage.get(FLOAT_KEY, true); if (f) setFloatEntries(JSON.parse(f.value)); } catch {}
    try { const e = await window.storage.get(EXPENSE_KEY, true); if (e) setExpenses(JSON.parse(e.value)); } catch {}
    try { const r = await window.storage.get(RATE_KEY, true); if (r) setDefaultRate(r.value); } catch {}
    setTimeout(() => setRefreshing(false), 600);
  }

  function persistWithRetry(key, value, attempt = 1) {
    window.storage.set(key, value, true).catch(() => {
      if (attempt < 5) setTimeout(() => persistWithRetry(key, value, attempt + 1), 1500 * attempt);
    });
  }

  useEffect(() => {
    if (loaded) persistWithRetry(TX_KEY, JSON.stringify(transactions));
  }, [transactions, loaded]);

  useEffect(() => {
    if (loaded) persistWithRetry(SUPPLIER_KEY, JSON.stringify(suppliers));
  }, [suppliers, loaded]);

  useEffect(() => {
    if (loaded) persistWithRetry(FLOAT_KEY, JSON.stringify(floatEntries));
  }, [floatEntries, loaded]);

  useEffect(() => {
    if (loaded) persistWithRetry(EXPENSE_KEY, JSON.stringify(expenses));
  }, [expenses, loaded]);

  const [floatAmt, setFloatAmt] = useState("");
  const [floatNote, setFloatNote] = useState("");
  const [floatDate, setFloatDate] = useState(todayStr());
  const [floatMethod, setFloatMethod] = useState("Cash");
  const [showFloatForm, setShowFloatForm] = useState(false);
  const [expAmt, setExpAmt] = useState("");
  const [expCategory, setExpCategory] = useState("Motorbike Rent");
  const [expDate, setExpDate] = useState(todayStr());
  const [expLink, setExpLink] = useState("");
  const [expNote, setExpNote] = useState("");
  const [expError, setExpError] = useState("");
  const [expFilterDate, setExpFilterDate] = useState(todayStr());
  const [expSavedMsg, setExpSavedMsg] = useState(false);

  function addFloatEntry() {
    const amt = parseFloat(floatAmt);
    if (isNaN(amt) || amt <= 0) { return; }
    setFloatEntries(p => [{ id: Date.now(), date: floatDate || todayStr(), time: nowStr(), amount: amt, method: floatMethod, notes: floatNote, enteredBy: whoIs }, ...p]);
    setFloatAmt(""); setFloatNote(""); setFloatDate(todayStr()); setFloatMethod("Cash"); setShowFloatForm(false);
  }

  function addExpense() {
    const amt = parseFloat(expAmt);
    if (isNaN(amt) || amt <= 0) { setExpError("⚠ Enter a valid amount."); return; }
    setExpError("");
    setExpenses(p => [{
      id: Date.now(), date: expDate || todayStr(), time: nowStr(),
      amount: amt, category: expCategory, deliveryRef: expLink, notes: expNote, enteredBy: whoIs,
    }, ...p]);
    setExpFilterDate(expDate || todayStr());
    setExpAmt(""); setExpLink(""); setExpNote(""); setExpDate(todayStr());
    setExpSavedMsg(true);
    setTimeout(() => setExpSavedMsg(false), 2000);
  }

  function deleteExpense(id) { requestDelete(id, "expense"); }


  function toggleDelivered(id) {
    setTransactions(prev => prev.map(t => t.id === id ? { ...t, delivered: !t.delivered } : t));
  }

  // Auto-calc for sell form
  useEffect(() => {
    const thb = parseFloat(form.thbAmount) || 0;
    const rate = parseFloat(form.rate) || 0;
    const commission = parseFloat(form.commission) || 0;
    const bdt = thb * rate;
    const net = bdt - commission * rate;
    setForm(f => ({ ...f, bdtAmount: thb && rate ? bdt.toFixed(2) : "", netBdt: thb && rate ? net.toFixed(2) : "" }));
  }, [form.thbAmount, form.rate, form.commission]);

  // Auto-calc for buy form
  useEffect(() => {
    const thb = parseFloat(buyForm.thbAmount) || 0;
    const rate = parseFloat(buyForm.rate) || 0;
    setBuyForm(f => ({ ...f, bdtCost: thb && rate ? (thb * rate).toFixed(2) : "" }));
  }, [buyForm.thbAmount, buyForm.rate]);

  // ─── auth handlers ───
  async function handleSetup() {
    const phone = suPhone.replace(/[^0-9+]/g, "");
    if (phone.length < 6) { setPwError("Enter a valid owner mobile number (min 6 digits)."); return; }
    if (suAdmin.length < 4) { setPwError("Owner password must be at least 4 characters."); return; }
    if (suAdmin !== suAdmin2) { setPwError("Owner passwords do not match."); return; }
    if (suStaff.length < 4) { setPwError("Staff password must be at least 4 characters."); return; }
    if (suStaff !== suStaff2) { setPwError("Staff passwords do not match."); return; }
    if (suAdmin === suStaff) { setPwError("Owner and Staff passwords must be different."); return; }
    // Enter the app immediately; save in background with retries
    setAdminPw(suAdmin); setStaffPw(suStaff); setOwnerPhone(phone);
    setRole("admin"); setScreen("app"); setView("dashboard"); setPwError("");
    const trySave = async (attempt = 1) => {
      try {
        await window.storage.set(ADMIN_PW_KEY, suAdmin, true);
        await window.storage.set(STAFF_PW_KEY, suStaff, true);
        await window.storage.set(OWNER_PHONE_KEY, phone, true);
      } catch {
        if (attempt < 5) setTimeout(() => trySave(attempt + 1), 1500 * attempt);
      }
    };
    trySave();
  }

  function handleLogin() {
    if (loginAs === "admin" && pwInput === adminPw) {
      setRole("admin"); setScreen("app"); setView("dashboard"); setPwInput(""); setPwError("");
    } else if (loginAs === "staff" && pwInput === staffPw) {
      if (!staffName.trim()) { setPwError("Enter your name so the owner knows who made each entry."); return; }
      setRole("staff"); setScreen("app"); setView("dashboard"); setPwInput(""); setPwError("");
    } else {
      setPwError("Wrong password."); setPwInput("");
    }
  }

  const whoIs = role === "admin" ? "Owner" : (staffName.trim() || "Staff");

  function logout() { setRole(null); setScreen("login"); setView("dashboard"); setForgotMode(false); setForgotVerified(false); }

  function verifyForgotPhone() {
    const entered = forgotPhone.replace(/[^0-9+]/g, "");
    const savedP = (ownerPhone || "").replace(/[^0-9+]/g, "");
    // Compare last 8 digits so +88 country code differences do not block the owner
    const a = entered.replace(/\D/g, "").slice(-8);
    const b = savedP.replace(/\D/g, "").slice(-8);
    if (a.length >= 6 && a === b) { setForgotVerified(true); setPwError(""); }
    else { setPwError("Mobile number does not match the owner number registered at setup."); }
  }

  function doPasswordReset() {
    if (resetPw.length < 4) { setPwError("New password must be at least 4 characters."); return; }
    if (resetPw !== resetPw2) { setPwError("Passwords do not match."); return; }
    setAdminPw(resetPw);
    persistWithRetry(ADMIN_PW_KEY, resetPw);
    setForgotMode(false); setForgotVerified(false); setForgotPhone(""); setResetPw(""); setResetPw2("");
    setPwError(""); setLoginAs("admin");
  }

  function handleChangePasswords() {
    setPwMsg("");
    if (pwCurrent !== adminPw) { setPwMsg("❌ Wrong current owner password."); return; }
    if (!pwNew || pwNew.length < 4) { setPwMsg("❌ New password must be at least 4 characters."); return; }
    if (pwNew !== pwNew2) { setPwMsg("❌ New passwords do not match."); return; }
    const key = pwTarget === "owner" ? ADMIN_PW_KEY : STAFF_PW_KEY;
    if (pwTarget === "owner") setAdminPw(pwNew); else setStaffPw(pwNew);
    persistWithRetry(key, pwNew);
    setPwMsg("✅ Password changed!");
    setPwCurrent(""); setPwNew(""); setPwNew2("");
  }

  // ─── data handlers ───
  function handleSaveSell() {
    if (!form.customerName || !form.thbAmount) { setFormError("⚠ Please fill Customer Name and THB Amount."); return; }
    const useRate = isAdmin ? (parseFloat(form.rate) || parseFloat(defaultRate) || 0) : (editingId ? (parseFloat(form.rate) || 0) : 0);
    if (isAdmin && !editingId && !useRate) { setFormError("⚠ Please enter a rate."); return; }
    setFormError("");
    const thb = parseFloat(form.thbAmount);
    const bdt = thb * useRate;
    const comm = parseFloat(form.commission) || 0;
    const net = bdt - comm * useRate;
    const tx = {
      id: Date.now(), kind: "SELL", date: form.deliveryDate || todayStr(), time: nowStr(), enteredBy: whoIs,
      customerName: form.customerName,
      customerPhone: form.customerPhone,
      assignedTo: form.assignedTo || "",
      delivered: false,
      thbAmount: thb, rate: useRate,
      bdtAmount: bdt,
      commission: comm,
      netBdt: net,
      paymentMethod: form.paymentMethod,
      amountPaid: parseFloat(form.amountPaid) || 0,
      balanceDue: net - (parseFloat(form.amountPaid) || 0),
      notes: form.notes,
    };
    if (editingId) {
      setTransactions(p => p.map(t => t.id === editingId
        ? { ...t, ...tx, id: t.id, date: form.deliveryDate || t.date, time: t.time, enteredBy: t.enteredBy, delivered: t.delivered }
        : t));
      setEditingId(null);
    } else {
      setTransactions(p => [tx, ...p]);
    }
    setForm({ ...initialForm, rate: form.rate });
    setSaved(true);
    setTimeout(() => { setSaved(false); setView(editingId ? "history" : "dashboard"); }, 1100);
  }

  function handleSaveBuy() {
    if (!buyForm.supplierName || !buyForm.thbAmount || !buyForm.rate) { setBuyError("⚠ Please fill Supplier Name, THB Amount, and Rate."); return; }
    setBuyError("");
    const firstPaid = parseFloat(buyForm.amountPaid) || 0;
    const cost = parseFloat(buyForm.bdtCost) || 0;
    const payments = firstPaid > 0
      ? [{ date: buyForm.paymentDate || todayStr(), amount: firstPaid, method: buyForm.paymentMethod }]
      : [];
    // Auto-apply advance from a previous entry
    let appliedAdvance = 0;
    if (buyForm.advanceFrom && buyForm.advanceAmt > 0) {
      appliedAdvance = Math.min(buyForm.advanceAmt, Math.max(cost - firstPaid, 0));
      if (appliedAdvance > 0) {
        payments.push({ date: todayStr(), amount: appliedAdvance, method: "Advance applied" });
        setSuppliers(prev => prev.map(s => {
          if (s.id !== buyForm.advanceFrom) return s;
          const pays = [...(s.payments || []), { date: todayStr(), amount: -appliedAdvance, method: "Advance → new buy" }];
          const paid = pays.reduce((sum, p) => sum + p.amount, 0);
          return { ...s, payments: pays, amountPaid: paid, balanceDue: s.bdtCost - paid };
        }));
      }
    }
    const b = {
      id: Date.now(), date: todayStr(), time: nowStr(),
      supplierName: buyForm.supplierName, supplierContact: buyForm.supplierContact,
      thbAmount: parseFloat(buyForm.thbAmount), rate: parseFloat(buyForm.rate),
      bdtCost: cost,
      payments,
      amountPaid: firstPaid + appliedAdvance,
      balanceDue: cost - firstPaid - appliedAdvance,
      notes: buyForm.notes,
    };
    setSuppliers(p => [b, ...p]);
    setBuyForm({ ...initialBuyForm });
    setSaved(true);
    setTimeout(() => { setSaved(false); setView("supplier"); }, 1100);
  }

  const [payingSupplierId, setPayingSupplierId] = useState(null);
  const [supPayAmt, setSupPayAmt] = useState("");
  const [supPayDate, setSupPayDate] = useState(todayStr());
  const [supPayMethod, setSupPayMethod] = useState("Cash");
  const [rateEditing, setRateEditing] = useState(false);
  const [rateInput, setRateInput] = useState("");
  const [formError, setFormError] = useState("");
  const [buyError, setBuyError] = useState("");
  const [confirmDelId, setConfirmDelId] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [pwTarget, setPwTarget] = useState("staff");
  const [pwCurrent, setPwCurrent] = useState("");
  const [pwNew, setPwNew] = useState("");
  const [pwNew2, setPwNew2] = useState("");
  const [pwMsg, setPwMsg] = useState("");
  const [backupText, setBackupText] = useState("");
  const [restoreText, setRestoreText] = useState("");
  const [backupMsg, setBackupMsg] = useState("");

  function addSupplierPayment(id) {
    const amt = parseFloat(supPayAmt);
    if (isNaN(amt) || amt <= 0) return;
    setSuppliers(prev => prev.map(s => {
      if (s.id !== id) return s;
      const payments = [...(s.payments || []), { date: supPayDate || todayStr(), amount: amt, method: supPayMethod }];
      const paid = payments.reduce((sum, p) => sum + p.amount, 0);
      return { ...s, payments, amountPaid: paid, balanceDue: s.bdtCost - paid };
    }));

                      <td style={S.td}>{tx.date.slice(5)}</td>
                      <td style={S.td}>{tx.time}</td>
                      <td style={{ ...S.td, fontWeight: 700 }}>{tx.customerName}</td>
                      <td style={S.td}>{tx.customerPhone || "—"}</td>
                      <td style={S.td}>{formatNum(tx.thbAmount)}</td>
                      {isAdmin && <td style={S.td}>{tx.rate}</td>}
                      {isAdmin && <td style={S.td}>{formatNum(tx.bdtAmount)}</td>}
                      {isAdmin && <td style={S.td}>{tx.commission ? formatNum(tx.commission) : "—"}</td>}
                      {isAdmin && <td style={{ ...S.td, color: (txGross(tx) ?? 0) >= 0 ? "#4caf50" : "#f44336", fontWeight: 700 }}>{txGross(tx) === null ? "—" : (txGross(tx) >= 0 ? "+" : "") + formatNum(txGross(tx), 0)}</td>}
                      {isAdmin && <td style={S.td}>{formatNum(tx.amountPaid)}</td>}
                      {isAdmin && <td style={{ ...S.td, color: tx.balanceDue > 0.01 ? "#f44336" : "#4caf50", fontWeight: 700 }}>{tx.balanceDue > 0.01 ? formatNum(tx.balanceDue) : "✅ Paid"}</td>}
                      {isAdmin && <td style={S.td}>{tx.paymentMethod}</td>}
                      <td style={S.td}>
                        <button style={{ ...S.payBtn(false), padding: "4px 10px", fontSize: 11, color: tx.delivered ? "#4caf50" : "#ffb74d", borderColor: tx.delivered ? "#4caf5055" : "#ffb74d55" }}
                          onClick={() => toggleDelivered(tx.id)}>{tx.delivered ? "✅ Delivered" : "🚚 Pending"}</button>
                      </td>
                      <td style={S.td}>
                        {isAdmin && <button style={{ ...S.payBtn(false), padding: "4px 10px", fontSize: 11, marginRight: 6 }} onClick={() => startEditSell(tx)}>✏️ Edit</button>}
                        {isAdmin && <span style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <button style={{ ...S.payBtn(false), padding: "4px 10px", fontSize: 11 }} onClick={() => startEditSell(tx)}>✏️</button>
                  <button style={S.delBtn} onClick={() => deleteSell(tx.id)}>{confirmDelId === tx.id ? "❌ Sure?" : "🗑"}</button>
                </span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : rangeDates.map(d => (
            <div key={d}>
              {histMode !== "day" && (
                <div style={{ margin: "14px 14px 0", display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", background: "#1a3a5c", borderRadius: 8 }}>
                  <span style={{ fontWeight: 800, fontSize: 13, color: "#4fc3f7" }}>{d === todayStr() ? "📅 Today" : d}</span>
                  <span style={{ fontSize: 12, color: "#7fa8c9" }}>{rangeSells.filter(t => t.date === d).length} · {formatNum(rangeSells.filter(t => t.date === d).reduce((s, t) => s + t.thbAmount, 0), 0)} THB</span>
                </div>
              )}
              {rangeSells.filter(t => t.date === d).map(tx => (
            <div key={tx.id} style={S.txCard("#4fc3f7")}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontWeight: 700, fontSize: 15 }}>{tx.customerName}</span>
                    <span style={S.txType("#1a3a5c", "#4fc3f7")}>SELL</span>
                    {!isAdmin && (tx.assignedTo || "") === whoIs && (tx.enteredBy || "") !== whoIs && <span style={S.txType("#3d2c00", "#ffb74d")}>📬 FROM BOSS</span>}
                    {isAdmin && tx.assignedTo && <span style={S.txType("#3d2c00", "#ffb74d")}>📬 {tx.assignedTo}</span>}
                  </div>
                  <div style={{ fontSize: 11, color: "#5a8aaa" }}>{tx.time} · {tx.paymentMethod}{tx.customerPhone ? ` · 📞 ${tx.customerPhone}` : ""}{isAdmin && tx.enteredBy && tx.enteredBy !== "Owner" && tx.enteredBy !== "admin" ? ` · ✍️ ${tx.enteredBy === "staff" ? "Staff" : tx.enteredBy}` : ""}</div>
                </div>
                {isAdmin && <span style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <button style={{ ...S.payBtn(false), padding: "4px 10px", fontSize: 11 }} onClick={() => startEditSell(tx)}>✏️</button>
                  <button style={S.delBtn} onClick={() => deleteSell(tx.id)}>{confirmDelId === tx.id ? "❌ Sure?" : "🗑"}</button>
                </span>}
              </div>
              <div style={{ display: "flex", gap: 10, fontSize: 13, color: "#7fa8c9", flexWrap: "wrap", marginTop: 4 }}>
                <span>💰 {formatNum(tx.thbAmount)} THB</span>
                {isAdmin && <span>📈 @ {tx.rate}</span>}
                {isAdmin && <span>🇧🇩 {formatNum(tx.bdtAmount)} BDT</span>}
                {isAdmin && tx.commission > 0 && <span>💼 {formatNum(tx.commission)} THB</span>}
                {isAdmin && txGross(tx) !== null && <span style={{ color: txGross(tx) >= 0 ? "#4caf50" : "#f44336", fontWeight: 700 }}>📈 {txGross(tx) >= 0 ? "+" : ""}{formatNum(txGross(tx), 0)} profit</span>}
              </div>
              {isAdmin && (tx.balanceDue > 0.01
                ? <div style={{ marginTop: 6, fontSize: 12, color: "#f44336", fontWeight: 700 }}>⚠ Remaining: {formatNum(tx.balanceDue)} BDT</div>
                : <div style={{ marginTop: 6, fontSize: 12, color: "#4caf50", fontWeight: 700 }}>✅ Fully Paid</div>)}
              <button style={{ marginTop: 8, width: "100%", padding: "8px 0", borderRadius: 8, border: `1px solid ${tx.delivered ? "#4caf5055" : "#ffb74d55"}`, background: tx.delivered ? "#0a1e0a" : "#1e140a", color: tx.delivered ? "#4caf50" : "#ffb74d", fontWeight: 700, fontSize: 12, cursor: "pointer" }}
                onClick={() => toggleDelivered(tx.id)}>
                {tx.delivered ? "✅ Delivered to Customer — tap to undo" : "🚚 Not Delivered — tap when delivered"}
              </button>
              {tx.notes ? <div style={{ fontSize: 11, color: "#5a8aaa", marginTop: 4 }}>📝 {tx.notes}</div> : null}
            </div>
              ))}
            </div>
          ))}
        </>
      )}

      {/* EXPENSES */}
      {view === "expenses" && (
        <>
          <div style={S.card}>
            <div style={S.cardTitle}>💸 Delivery Expenses</div>
            <div style={S.statGrid}>
              <div style={S.stat("#ff8a65")}>
                <div style={S.statLabel}>Today's Expenses</div>
                <div style={S.statVal}>{formatNum(todayExpTotal, 0)}</div>
                <div style={S.statCur}>THB · {todayExpenses.length} entries</div>
              </div>
              <div style={S.stat("#ffb74d")}>
                <div style={S.statLabel}>This Month Total</div>
                <div style={S.statVal}>{formatNum(monthExpTotal, 0)}</div>
                <div style={S.statCur}>THB to reimburse staff</div>
              </div>
            </div>
          </div>

          <div style={S.card}>
            <div style={S.cardTitle}>➕ Add Expense</div>
            <label style={S.label}>Amount (THB) *</label>
            <input style={S.input} type="number" inputMode="decimal" placeholder="0.00" value={expAmt} onChange={e => { setExpAmt(e.target.value); setExpError(""); }} />
            <div style={{ marginTop: 8 }}>
              <label style={S.label}>Category</label>
              <div style={S.payRow}>
                {["Motorbike Rent", "Transport", "Fuel", "Food", "Mobile/Data", "Other"].map(m => (
                  <button key={m} style={S.payBtn(expCategory === m)} onClick={() => setExpCategory(m)}>{m}</button>
                ))}
              </div>
            </div>
            <div style={{ marginTop: 8 }}>
              <label style={S.label}>Date</label>
              <DateField value={expDate} onChange={setExpDate} />
            </div>
            <div style={{ marginTop: 8 }}>
              <label style={S.label}>For which delivery? (optional)</label>
              <select style={{ ...S.input, appearance: "auto" }} value={expLink} onChange={e => setExpLink(e.target.value)}>
                <option value="">— General / not linked —</option>
                {visSells.filter(t => t.date === (expDate || todayStr())).map(t => (
                  <option key={t.id} value={`${t.customerName} (${formatNum(t.thbAmount, 0)} THB)`}>
                    {t.customerName} — {formatNum(t.thbAmount, 0)} THB
                  </option>
                ))}
              </select>
            </div>
            <div style={{ marginTop: 8 }}>
              <label style={S.label}>Note (optional)</label>
              <input style={S.input} placeholder="e.g. bike rent for Rahim delivery" value={expNote} onChange={e => setExpNote(e.target.value)} />
            </div>
            {expError && <div style={{ marginTop: 8, color: "#f44336", fontSize: 13, fontWeight: 600 }}>{expError}</div>}
            {expSavedMsg && <div style={{ marginTop: 8, padding: "10px 12px", borderRadius: 8, background: "#0a1e0a", border: "1px solid #4caf50", color: "#4caf50", fontSize: 14, fontWeight: 700, textAlign: "center" }}>✅ Expense saved!</div>}
            <button style={{ marginTop: 12, width: "100%", padding: "12px 0", borderRadius: 10, border: "none", background: "linear-gradient(135deg,#e65100,#bf360c)", color: "#fff", fontWeight: 800, fontSize: 15, cursor: "pointer" }}
              onClick={addExpense}>Save Expense ✓</button>
          </div>

          <div style={S.dateBar}>
            <span style={{ fontSize: 12, color: "#5a8aaa" }}>Date:</span>
            <div style={{ flex: 1 }}><DateField value={expFilterDate} onChange={setExpFilterDate} /></div>
            <span style={{ fontSize: 12, color: "#ff8a65" }}>{filteredExpenses.length} · {formatNum(filteredExpenses.reduce((s, x) => s + x.amount, 0), 0)} THB</span>
          </div>

          {filteredExpenses.length === 0 ? (
            <div style={S.noData}>No expenses on this date</div>
          ) : filteredExpenses.map(x => (
            <div key={x.id} style={S.txCard("#ff8a65")}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 15 }}>{x.category}</div>
                  <div style={{ fontSize: 11, color: "#5a8aaa" }}>{x.date} · {x.time} · by {x.enteredBy === "Owner" || x.enteredBy === "admin" ? "👑 Owner" : `👤 ${x.enteredBy === "staff" ? "Staff" : x.enteredBy}`}</div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontWeight: 800, fontSize: 16, color: "#ff8a65" }}>{formatNum(x.amount)} THB</span>
                  {isAdmin && <button style={S.delBtn} onClick={() => deleteExpense(x.id)}>{confirmDelId === x.id ? "❌ Sure?" : "🗑"}</button>}
                </div>
              </div>
              {x.deliveryRef ? <div style={{ fontSize: 12, color: "#7fa8c9", marginTop: 4 }}>🚚 For: {x.deliveryRef}</div> : null}
              {x.notes ? <div style={{ fontSize: 11, color: "#5a8aaa", marginTop: 4 }}>📝 {x.notes}</div> : null}
            </div>
          ))}
        </>
      )}

      {/* DUES */}
      {view === "dues" && (
        <>
          <div style={{ background: "#2d1010", borderRadius: 12, padding: 16, margin: "12px 14px 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 11, color: "#f44336", fontWeight: 700 }}>TOTAL REMAINING FROM CUSTOMERS</div>
              <div style={{ fontSize: 26, fontWeight: 800, color: "#f44336" }}>{formatNum(totalDue)} BDT</div>
            </div>
            <div style={{ fontSize: 30 }}>⚠️</div>
          </div>
          {dueSells.length === 0 ? (
            <div style={S.noData}>🎉 No remaining balances!</div>
          ) : dueSells.map(tx => (
            <div key={tx.id} style={{ background: "#1e0a0a", borderRadius: 12, padding: 14, margin: "10px 14px 0", borderLeft: "3px solid #f44336" }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{tx.customerName}</div>
              <div style={{ fontSize: 20, fontWeight: 800, color: "#f44336" }}>{formatNum(tx.balanceDue)} BDT remaining</div>
              <div style={{ fontSize: 12, color: "#7fa8c9", marginTop: 4 }}>📅 {tx.date} · {tx.time} · {formatNum(tx.thbAmount)} THB @ {tx.rate}</div>
              <div style={{ fontSize: 12, color: "#7fa8c9" }}>Total: {formatNum(tx.netBdt || tx.bdtAmount)} BDT · Paid: {formatNum(tx.amountPaid)} BDT</div>
            </div>
          ))}
        </>
      )}

      {/* MOBILE BOTTOM NAV */}
      {!wide && (
        <nav style={S.nav}>
          {navItems.map(n => (
            <button key={n.key} style={S.navBtn(view === n.key)} onClick={() => goto(n.key)}>
              <span style={{ fontSize: 18 }}>{n.icon}</span>
              <span>{n.label}</span>
            </button>
          ))}
        </nav>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
